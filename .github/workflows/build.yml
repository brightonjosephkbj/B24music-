name: Build Signed Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm install

      # The on-device ImageMagick `convert` commands silently failed
      # earlier (broken libheif in Termux), so the derived icon files were
      # left as tiny placeholder stubs. Regenerate all of them fresh here,
      # every run, straight from the real icon.png - Pillow has no
      # dependency on libheif at all, so this sidesteps that problem
      # completely rather than trying to fix Termux's install.
      - name: Generate Android icon assets from icon.png
        run: |
          pip install --quiet --break-system-packages pillow
          python3 << 'ICONEOF'
          from PIL import Image

          base = Image.open("assets/icon.png").convert("RGBA")

          base.resize((1024, 1024)).save("assets/android-icon-foreground.png")

          bg = Image.new("RGBA", (1024, 1024), (15, 18, 32, 255))
          bg.save("assets/android-icon-background.png")

          base.resize((1024, 1024)).convert("L").convert("RGBA").save("assets/android-icon-monochrome.png")

          base.resize((48, 48)).save("assets/favicon.png")
          base.resize((512, 512)).save("assets/splash-icon.png")
          ICONEOF

      # Managed Expo projects don't commit an android/ folder - prebuild
      # generates it fresh from app.json each run, so it always reflects
      # your current plugins (media-library, camera, location, audio, video).
      - name: Expo prebuild (generate native Android project)
        run: npx expo prebuild --platform android --clean

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Verify decoded keystore
        run: |
          keytool -list -v \
            -keystore android/app/release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" \
          || (echo "::error::Decoded keystore is invalid — check ANDROID_KEYSTORE_BASE64 secret was base64 -w0 encoded correctly with no line wraps." && exit 1)

      # expo prebuild's generated build.gradle already has a release build
      # type pointing at signingConfigs.debug by default - we add a real
      # signingConfigs.release block and repoint that one line at it,
      # rather than inserting new lines into buildTypes (whitespace there
      # can shift between Expo SDK versions, this text is stable).
      - name: Configure release signing
        run: |
          python3 << 'PYEOF'
          import re

          path = "android/app/build.gradle"
          with open(path) as f:
              content = f.read()

          # Expo's generated build.gradle always ships a signingConfigs{}
          # block already (with a debug{} entry inside it) - the old check
          # here only looked for whether *any* signingConfigs{} existed and
          # skipped adding release{} if one did, which left buildTypes.release
          # pointing at a signing config that was never actually defined.
          if "storeFile file('release.keystore')" not in content:
              signing_release_block = '''        release {
                      storeFile file('release.keystore')
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
          '''
              if "signingConfigs {" in content:
                  content = content.replace("signingConfigs {\n", "signingConfigs {\n" + signing_release_block, 1)
              else:
                  signing_full_block = "    signingConfigs {\n" + signing_release_block + "    }\n"
                  content = content.replace("android {\n", "android {\n" + signing_full_block, 1)

          # Only repoint buildTypes.release's signing line - buildTypes.debug
          # should keep pointing at signingConfigs.debug, so a plain
          # assembleDebug still works locally without the release env vars set.
          buildtypes_marker = "buildTypes {"
          if buildtypes_marker in content:
              before, after = content.split(buildtypes_marker, 1)
              after, n = re.subn(
                  r'(release\s*\{[^}]*?)signingConfig signingConfigs\.debug',
                  r'\1signingConfig signingConfigs.release',
                  after,
                  count=1,
                  flags=re.S,
              )
              content = before + buildtypes_marker + after

          with open(path, "w") as f:
              f.write(content)
          print("build.gradle patched for release signing")
          PYEOF

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: b24meet-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
